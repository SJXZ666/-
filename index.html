<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>比赛系统</title>
  <style>
    :root {
      --bg0: #0b0217;
      --bg1: #1b0030;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff2d75;
      --neon-purple: #8a2be2;
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(0,240,255,0.35);
      --text: #f4f0ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 20%, rgba(138,43,226,0.35), transparent 35%),
        radial-gradient(circle at 90% 80%, rgba(0,240,255,0.25), transparent 40%),
        linear-gradient(135deg, #0b0217, #1b0030 50%, #05010a);
      background-attachment: fixed;
      overflow-x: hidden;
      padding: 20px;
    }
    .hidden { display: none !important; }
    #app { max-width: 1400px; margin: 0 auto; }
    .hero { text-align: center; padding: 30px 0 20px; }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.6rem);
      letter-spacing: 3px;
      text-shadow: 0 0 10px #00f0ff, 0 0 30px #ff2d75;
      animation: neonPulse 2s ease-in-out infinite alternate;
    }
    .hero p { margin-top: 10px; color: #c9bfff; letter-spacing: 1px; }
    @keyframes neonPulse {
      from { text-shadow: 0 0 8px #00f0ff, 0 0 25px #ff2d75; }
      to { text-shadow: 0 0 18px #00f0ff, 0 0 45px #ff2d75, 0 0 60px #8a2be2; }
    }
    .panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 0 25px rgba(0,240,255,0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      margin-bottom: 20px;
      animation: fadeInUp 0.4s ease both;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h2, h3, h4 { letter-spacing: 1px; margin-bottom: 10px; }
    .input-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; align-items: center; }
    input, select {
      padding: 12px 14px;
      border: 1px solid rgba(0,240,255,0.4);
      border-radius: 12px;
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      min-width: 150px;
    }
    input:focus, select:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0,240,255,0.45);
    }
    input::placeholder { color: #9a8fbf; }
    .btn-primary, .btn-ghost {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
      transition: 0.25s;
      white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff2d75, #7a00ff);
      color: #fff;
      box-shadow: 0 0 18px rgba(255,45,117,0.5);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(255,45,117,0.8);
    }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost {
      background: rgba(0,240,255,0.1);
      color: #00f0ff;
      border: 1px solid rgba(0,240,255,0.5);
    }
    .btn-ghost:hover {
      background: rgba(0,240,255,0.25);
      box-shadow: 0 0 18px rgba(0,240,255,0.5);
    }
    .btn-ghost.active {
      background: rgba(0,240,255,0.3);
      box-shadow: 0 0 12px rgba(0,240,255,0.5);
    }
    .hint { margin: 10px 0; color: #c9bfff; }
    .player-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
      min-height: 50px;
    }
    .player-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(0,240,255,0.3);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .player-item:hover {
      background: rgba(0,240,255,0.15);
      box-shadow: 0 0 15px rgba(0,240,255,0.3);
    }
    .remove-btn { background: none; border: none; color: #ff6f91; cursor: pointer; font-size: 16px; }
    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .standings-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      overflow: hidden;
      font-size: 14px;
    }
    .standings-table th, .standings-table td {
      padding: 6px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      vertical-align: top;
    }
    .standings-table th {
      background: rgba(0,240,255,0.1);
      color: #00f0ff;
      font-weight: bold;
    }
    .standings-table tr:hover { background: rgba(0,240,255,0.05); }
    .group-row-terminal {
      background: rgba(255,45,117,0.15);
      border-left: 3px solid #ff2d75;
    }
    .player-cell { display: flex; flex-wrap: wrap; gap: 6px; }
    .player-tag {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(0,240,255,0.3);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: 0.2s;
    }
    .player-tag:hover { background: rgba(0,240,255,0.2); }
    .player-tag .team { color: #c9bfff; font-size: 11px; }
    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .ranking-table th, .ranking-table td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .ranking-table th {
      background: rgba(0,240,255,0.1);
      color: #00f0ff;
      font-weight: bold;
    }
    .ranking-table tr:hover { background: rgba(255,255,255,0.05); }
    .ranking-table .clickable { cursor: pointer; }
    .match-list { display: flex; flex-direction: column; gap: 14px; }
    .match-card {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(0,240,255,0.4);
      border-radius: 16px;
      padding: 16px;
      transition: 0.25s;
    }
    .match-card:hover {
      box-shadow: 0 0 24px rgba(0,240,255,0.3);
      transform: translateY(-2px);
    }
    .match-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #00f0ff;
      font-weight: bold;
    }
    .match-teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .team-name {
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .team-org { color: #c9bfff; font-size: 13px; }
    .vs { font-size: 16px; color: #ff2d75; font-weight: bold; }
    .score-row { display: flex; align-items: center; gap: 10px; }
    .score-row input { width: 80px; }
    .winner-select { flex: 1; min-width: 120px; }
    .bracket { display: flex; gap: 20px; overflow-x: auto; padding: 15px 0; }
    .bracket-col { min-width: 220px; flex: 1; }
    .bracket-col h4 { margin-bottom: 12px; color: #00f0ff; }
    .bracket-match {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(0,240,255,0.35);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .bracket-player {
      padding: 8px 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .bracket-player:hover { background: rgba(255,255,255,0.1); }
    .bracket-player.winner {
      border: 1px solid #00ff88;
      box-shadow: 0 0 12px rgba(0,255,136,0.4);
      color: #00ff88;
    }
    .bracket-score { text-align: center; color: #c9bfff; margin: 4px 0; }
    .champion-card {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #1b0030;
      font-weight: bold;
      text-align: center;
      padding: 14px;
      border-radius: 14px;
    }
    .summary-card {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(0,240,255,0.35);
      border-radius: 16px;
      padding: 16px;
      flex: 1 1 300px;
    }
    .summary-card.champion {
      border-color: #ffd700;
      box-shadow: 0 0 25px rgba(255,215,0,0.5);
    }
    .summary-card h3 span { color: #c9bfff; font-size: 15px; }
    .record { margin: 8px 0; color: #e0d6ff; }
    .history { list-style: none; margin-top: 10px; }
    .history li {
      padding: 4px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.15);
      color: #d9ccff;
    }
    .tournament-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    .tournament-tab {
      padding: 8px 15px;
      border-radius: 999px;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      background: rgba(0,0,0,0.3);
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tournament-tab:hover { background: rgba(0,240,255,0.2); }
    .tournament-tab.active {
      background: linear-gradient(135deg, #00f0ff, #7a00ff);
      color: #fff;
      border-color: #00f0ff;
    }
    .tournament-tab .delete-tournament { color: #ff6f91; font-size: 14px; cursor: pointer; }
    .prediction-box {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(0,240,255,0.3);
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
    }
    .prediction-box h4 { margin: 10px 0 5px; color: #00f0ff; }
    .history-match-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(0,240,255,0.2);
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .history-match-info { flex: 1; }
    .history-match-info .score { color: #00f0ff; font-weight: bold; }
    .history-match-delete { cursor: pointer; color: #ff6f91; margin-left: 10px; font-size: 18px; }
    .player-pool-list { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
    .player-pool-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(0,240,255,0.3);
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s;
    }
    .player-pool-item:hover {
      background: rgba(0,240,255,0.15);
      box-shadow: 0 0 15px rgba(0,240,255,0.3);
    }
    .checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 15px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(0,240,255,0.2);
      border-radius: 8px;
      cursor: pointer;
    }
    .checkbox-item:hover { background: rgba(0,240,255,0.1); }
    .checkbox-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }
    .modal-content {
      background: #1a0033;
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 25px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 0 40px rgba(0,240,255,0.3);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 { margin: 0; }
    .modal-close { background: none; border: none; color: #ff6f91; font-size: 28px; cursor: pointer; }
    .sound-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,240,255,0.2);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 999;
      font-size: 20px;
    }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .grid .panel { flex: 1 1 400px; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .topbar h2, .topbar h3 { margin: 0; }
    #summaryContainer { display: flex; flex-wrap: wrap; gap: 16px; }
    @media (max-width: 768px) {
      body { padding: 10px; }
      .input-row { flex-direction: column; }
      .input-row input, .input-row select { width: 100%; }
      .grid { flex-direction: column; }
      .bracket { flex-direction: column; }
      .bracket-col { min-width: 100%; }
      .score-row { flex-direction: column; align-items: stretch; }
      .score-row input { width: 100%; }
      .match-teams { flex-direction: column; gap: 10px; }
      .vs { text-align: center; }
      .hero h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="sound-toggle" id="soundToggle">🔊</div>

  <div id="app">
    <header class="hero">
      <h1>比赛系统</h1>
      <p>系列赛事管理 · 冠军预测 · 历史评分</p>
    </header>

    <section id="tournamentManager" class="panel">
      <h3>系列赛事</h3>
      <div class="input-row">
        <input id="newTournamentName" placeholder="新赛事名称" />
        <select id="newTournamentTier">
          <option value="T1">T1 - 顶级赛事</option>
          <option value="T2" selected>T2 - 中级赛事</option>
          <option value="T3">T3 - 初级赛事</option>
        </select>
        <button id="createTournamentBtn" class="btn-ghost">创建赛事</button>
        <button id="leaderboardBtn" class="btn-ghost">总排行榜</button>
        <button id="managePlayersBtn" class="btn-ghost">选手池管理</button>
        <button id="clearAllDataBtn" class="btn-ghost" style="color:#ff6f91;">删除所有数据</button>
      </div>
      <div id="tournamentTabs" class="tournament-tabs"></div>
    </section>

    <section id="setupScreen">
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <h2>参赛选手登记</h2>
          <div>
            <button id="selectPlayersBtn" class="btn-ghost">从选手池选择</button>
            <button id="importBtn" class="btn-ghost">导入全局选手</button>
            <button id="exampleBtn" class="btn-ghost">示例数据</button>
          </div>
        </div>
        <div class="input-row">
          <input id="playerName" placeholder="选手名称" />
          <select id="teamSelect">
            <option value="">-- 选择队伍 --</option>
            <option value="__new__">新建队伍...</option>
          </select>
          <input id="newTeamNameInput" placeholder="新队伍名称" style="display:none;" />
          <button id="addPlayerBtn" class="btn-primary">添加选手</button>
        </div>
        <p class="hint">当前人数：<span id="playerCount">0</span> / 16</p>
        <ul id="playerList" class="player-list"></ul>
        <button id="startBtn" class="btn-primary" disabled>开始瑞士轮</button>
      </div>
    </section>

    <section id="tournamentScreen" class="hidden">
      <div class="panel">
        <div class="topbar">
          <h2 id="phaseTitle">瑞士轮阶段</h2>
          <h3 id="roundInfo"></h3>
          <div>
            <button id="historyBtn" class="btn-ghost">比赛历史</button>
            <button id="totalSummaryBtn" class="btn-ghost">查看总览</button>
            <button id="currentRankingBtn" class="btn-ghost">当前排名</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>智能预测</h3>
        <div id="predictionContainer"></div>
      </div>

      <div class="grid">
        <div class="panel">
          <h3>战绩分组</h3>
          <div id="swissStandings"></div>
        </div>

        <div class="panel" id="matchPanel">
          <h3 id="matchPanelTitle">当前比赛</h3>
          <div id="matchList"></div>
          <button id="submitRoundBtn" class="btn-primary">提交本轮结果</button>
        </div>
      </div>

      <div class="panel hidden" id="playoffSection">
        <h3>淘汰赛对阵图</h3>
        <div id="bracketContainer"></div>
        <h4 id="playoffRoundTitle"></h4>
        <div id="playoffMatchList"></div>
        <button id="submitPlayoffBtn" class="btn-primary hidden">提交淘汰赛结果</button>
      </div>
    </section>

    <section id="summaryScreen" class="hidden">
      <div class="panel">
        <h2>最终总结</h2>
        <div id="championDisplay"></div>
        <div id="summaryContainer"></div>
        <button id="restartBtn" class="btn-primary">重新开始</button>
      </div>
    </section>

    <section id="leaderboardScreen" class="hidden">
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
          <h2>总排行榜</h2>
          <button id="backFromLeaderboardBtn" class="btn-ghost">返回</button>
        </div>
        <div class="input-row">
          <button id="playerRankingTab" class="btn-ghost active">选手排行</button>
          <button id="teamRankingTab" class="btn-ghost">队伍排行</button>
        </div>
        <div id="leaderboardContainer"></div>
      </div>
    </section>

    <section id="playerPoolScreen" class="hidden">
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
          <h2>全局选手池</h2>
          <button id="backFromPoolBtn" class="btn-ghost">返回</button>
        </div>
        <div class="input-row">
          <input id="poolPlayerName" placeholder="新选手名称" />
          <select id="poolTeamSelect">
            <option value="">-- 选择队伍 --</option>
            <option value="__new__">新建队伍...</option>
          </select>
          <input id="poolNewTeamName" placeholder="新队伍名称" style="display:none;" />
          <button id="addPoolPlayerBtn" class="btn-primary">添加选手到池</button>
        </div>
        <div id="playerPoolList"></div>

        <div style="margin-top:25px;">
          <h3>队伍管理</h3>
          <div class="input-row">
            <input id="newTeamName" placeholder="新队伍名称" />
            <button id="addTeamBtn" class="btn-primary">添加队伍</button>
          </div>
          <div id="teamList"></div>
        </div>
      </div>
    </section>
  </div>

  <div id="selectPlayersModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>选择参赛选手</h2>
        <button class="modal-close" id="closeSelectPlayersBtn">&times;</button>
      </div>
      <div class="modal-body">
        <p>从全局选手池中选择参加本次赛事的选手（最多16人）</p>
        <div id="playerPoolCheckboxList"></div>
        <button id="confirmSelectPlayersBtn" class="btn-primary">确认选择</button>
      </div>
    </div>
  </div>

  <div id="historyModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>所有比赛历史</h2>
        <button class="modal-close" id="closeHistoryBtn">&times;</button>
      </div>
      <div class="modal-body" id="historyListContainer"></div>
    </div>
  </div>

  <div id="playerModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="playerModalTitle">选手详情</h2>
        <button class="modal-close" id="closePlayerModal">&times;</button>
      </div>
      <div class="modal-body" id="playerModalBody"></div>
    </div>
  </div>

  <div id="totalSummaryModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>当前赛事总览</h2>
        <button class="modal-close" id="closeTotalSummaryBtn">&times;</button>
      </div>
      <div class="modal-body" id="totalSummaryBody"></div>
    </div>
  </div>

  <div id="currentRankingModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>当前赛事排名</h2>
        <button class="modal-close" id="closeCurrentRankingBtn">&times;</button>
      </div>
      <div class="modal-body" id="currentRankingBody"></div>
    </div>
  </div>

<script>
// ==================== 数据持久化 ====================
const STORAGE_KEY = 'swiss_tournaments_v12';

let globalData = loadData();
let teams = globalData.teams || [];
let globalPlayers = globalData.globalPlayers || [];
let tournaments = globalData.tournaments || [];
let currentTournamentId = globalData.currentTournamentId || null;
let currentTournament = null;
let globalMatchHistory = globalData.globalMatchHistory || [];

let players = [];
let allMatches = [];
let swissRound = 0;
let currentPhase = 'setup';
let swissMatches = [];
let playoffStage = 0;
let currentPlayoffMatches = [];
let qfMatches = [];
let sfMatches = [];
let finalMatch = null;
let champion = null;
let soundEnabled = true;
let nextPlayerId = 1;

const $ = (selector) => document.querySelector(selector);

function loadData() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      const parsed = JSON.parse(stored);
      return {
        teams: parsed.teams || [],
        tournaments: parsed.tournaments || [],
        globalPlayers: parsed.globalPlayers || [],
        currentTournamentId: parsed.currentTournamentId || null,
        globalMatchHistory: parsed.globalMatchHistory || []
      };
    }
  } catch (e) {
    console.error('数据加载失败:', e);
  }
  return { teams: [], tournaments: [], globalPlayers: [], currentTournamentId: null, globalMatchHistory: [] };
}

function saveData() {
  try {
    const data = {
      teams,
      tournaments,
      globalPlayers,
      currentTournamentId,
      globalMatchHistory
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.error('数据保存失败:', e);
  }
}

function generateId() {
  return 'T' + Date.now() + Math.floor(Math.random() * 1000);
}

function getTournament(id) {
  return tournaments.find(t => t.id === id);
}

function createDefaultTournament() {
  const t = {
    id: generateId(),
    name: '默认赛事',
    tier: 'T2',
    players: [],
    matches: [],
    swissRound: 0,
    phase: 'setup',
    playoffStage: 0,
    currentPlayoffMatches: [],
    qfMatches: [],
    sfMatches: [],
    finalMatch: null,
    champion: null,
    createdAt: Date.now()
  };
  tournaments.push(t);
  return t;
}

let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  return audioCtx;
}

function playSound(type) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    let freq = 440, dur = 0.15, vol = 0.2;
    switch(type) {
      case 'add': freq = 600; dur = 0.1; vol = 0.2; break;
      case 'submit': freq = 800; dur = 0.2; vol = 0.25; break;
      case 'win': freq = 1000; dur = 0.3; vol = 0.3; break;
      case 'error': freq = 200; dur = 0.4; vol = 0.3; break;
      case 'delete': freq = 300; dur = 0.2; vol = 0.2; break;
      case 'click': freq = 500; dur = 0.05; vol = 0.1; break;
    }
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.value = vol;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + dur);
  } catch (e) {}
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getPlayer(id) { return players.find(p => p.id === Number(id)); }

function getOpponents(playerId) {
  const opp = new Set();
  allMatches.forEach(m => {
    if (m.p1.id === playerId) opp.add(m.p2.id);
    if (m.p2.id === playerId) opp.add(m.p1.id);
  });
  return opp;
}

const TEAM_COLORS = [
  '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4',
  '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7DC6F',
  '#BB8FCE', '#85C1E9', '#F8C471', '#82E0AA',
  '#F1948A', '#85929E', '#73C6B6', '#E59866'
];
let colorIndex = 0;

function generateTeamColor() {
  const color = TEAM_COLORS[colorIndex % TEAM_COLORS.length];
  colorIndex++;
  return color;
}

function getTeamById(teamId) { return teams.find(t => t.id === teamId); }
function getTeamByName(teamName) { return teams.find(t => t.name.toLowerCase() === teamName.toLowerCase()); }

function getOrCreateTeam(teamName) {
  let team = getTeamByName(teamName);
  if (!team) {
    team = {
      id: 'TEAM' + Date.now() + Math.floor(Math.random() * 1000),
      name: teamName,
      color: generateTeamColor(),
      createdAt: Date.now()
    };
    teams.push(team);
    saveData();
  }
  return team;
}

function createTeam(teamName) {
  if (!teamName || teamName.trim() === '') { alert('请输入队伍名称'); return null; }
  if (getTeamByName(teamName.trim())) { alert('该队伍已存在'); return null; }
  const team = {
    id: 'TEAM' + Date.now() + Math.floor(Math.random() * 1000),
    name: teamName.trim(),
    color: generateTeamColor(),
    createdAt: Date.now()
  };
  teams.push(team);
  saveData();
  return team;
}

function deleteTeam(teamId) {
  const idx = teams.findIndex(t => t.id === teamId);
  if (idx === -1) return;
  const inUse = globalPlayers.some(p => p.teamId === teamId);
  if (inUse) { alert('该队伍仍有选手使用，无法删除'); return; }
  if (!confirm(`确定删除队伍 ${teams[idx].name}？`)) return;
  teams.splice(idx, 1);
  saveData();
}

function getOrCreateGlobalPlayer(name, teamId, teamName) {
  let gp = globalPlayers.find(p => p.name === name);
  if (!gp) {
    const team = teamId ? getTeamById(teamId) : getOrCreateTeam(teamName);
    gp = {
      id: 'GP' + Date.now() + Math.floor(Math.random() * 1000),
      name,
      teamId: team.id,
      teamName: team.name,
      color: team.color,
      elo: 1200,
      matchCount: 0,
      totalWins: 0,
      totalLosses: 0,
      totalScore: 0,
      totalNetScore: 0,
      championships: 0
    };
    globalPlayers.push(gp);
    saveData();
  }
  return gp;
}

function getGlobalPlayerById(gpId) { return globalPlayers.find(g => g.id === gpId); }

function addPlayerToPool(name, teamId, teamName) {
  if (!name) { alert('请填写选手名称'); return false; }
  if (globalPlayers.some(p => p.name === name)) { alert('该选手已在选手池中'); return false; }
  getOrCreateGlobalPlayer(name, teamId, teamName);
  saveData();
  return true;
}

function deletePlayerFromPool(gpId) {
  const idx = globalPlayers.findIndex(p => p.id === gpId);
  if (idx === -1) return;
  if (!confirm(`确定从选手池中删除 ${globalPlayers[idx].name}？`)) return;
  globalPlayers.splice(idx, 1);
  saveData();
}

function changePlayerTeam(gpId, newTeamId) {
  const gp = getGlobalPlayerById(gpId);
  const team = getTeamById(newTeamId);
  if (!gp || !team) return false;
  gp.teamId = team.id;
  gp.teamName = team.name;
  gp.color = team.color;
  players.forEach(p => {
    if (p.globalId === gpId) { p.team = team.name; p.color = team.color; p.teamId = team.id; }
  });
  saveData();
  return true;
}

function renderTournamentTabs() {
  const container = $('#tournamentTabs');
  if (!container) return;
  container.innerHTML = '';
  tournaments.forEach(t => {
    const tab = document.createElement('span');
    tab.className = 'tournament-tab' + (t.id === currentTournamentId ? ' active' : '');
    tab.innerHTML = `${t.name} <span style="font-size:12px;color:#ffd700;">[${t.tier}]</span> <span class="delete-tournament" data-id="${t.id}">✕</span>`;
    tab.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete-tournament')) {
        e.stopPropagation();
        deleteTournament(t.id);
      } else {
        switchTournament(t.id);
      }
    });
    container.appendChild(tab);
  });
}

function switchTournament(id) {
  if (!getTournament(id)) return;
  saveCurrentTournamentData();
  currentTournamentId = id;
  currentTournament = getTournament(id);
  loadCurrentTournamentData();
  renderTournamentTabs();
  renderCurrentView();
  saveData();
}

function createTournament(name, tier) {
  if (!name) { alert('请输入赛事名称'); return; }
  saveCurrentTournamentData();
  const t = {
    id: generateId(),
    name,
    tier: tier || 'T2',
    players: [],
    matches: [],
    swissRound: 0,
    phase: 'setup',
    playoffStage: 0,
    currentPlayoffMatches: [],
    qfMatches: [],
    sfMatches: [],
    finalMatch: null,
    champion: null,
    createdAt: Date.now()
  };
  tournaments.push(t);
  currentTournamentId = t.id;
  currentTournament = t;
  loadCurrentTournamentData();
  renderTournamentTabs();
  renderCurrentView();
  saveData();
  playSound('add');
}

function deleteTournament(id) {
  if (!confirm('确定删除该赛事及其所有数据？')) return;
  const idx = tournaments.findIndex(t => t.id === id);
  if (idx === -1) return;
  tournaments.splice(idx, 1);
  if (currentTournamentId === id) {
    if (tournaments.length > 0) {
      currentTournamentId = tournaments[0].id;
      currentTournament = tournaments[0];
    } else {
      currentTournament = createDefaultTournament();
      currentTournamentId = currentTournament.id;
    }
  }
  loadCurrentTournamentData();
  renderTournamentTabs();
  renderCurrentView();
  saveData();
  playSound('delete');
}

function loadCurrentTournamentData() {
  if (!currentTournament) return;
  players = currentTournament.players || [];
  allMatches = currentTournament.matches || [];
  swissRound = currentTournament.swissRound || 0;
  currentPhase = currentTournament.phase || 'setup';
  playoffStage = currentTournament.playoffStage || 0;
  currentPlayoffMatches = currentTournament.currentPlayoffMatches || [];
  qfMatches = currentTournament.qfMatches || [];
  sfMatches = currentTournament.sfMatches || [];
  finalMatch = currentTournament.finalMatch || null;
  champion = currentTournament.champion || null;
  nextPlayerId = players.length > 0 ? Math.max(...players.map(p => p.id)) + 1 : 1;
}

function saveCurrentTournamentData() {
  if (!currentTournament) return;
  currentTournament.players = players;
  currentTournament.matches = allMatches;
  currentTournament.swissRound = swissRound;
  currentTournament.phase = currentPhase;
  currentTournament.playoffStage = playoffStage;
  currentTournament.currentPlayoffMatches = currentPlayoffMatches;
  currentTournament.qfMatches = qfMatches;
  currentTournament.sfMatches = sfMatches;
  currentTournament.finalMatch = finalMatch;
  currentTournament.champion = champion;
  saveData();
}

function getAvailableGlobalPlayers() {
  return globalPlayers.filter(gp => !players.some(p => p.globalId === gp.id));
}

function addPlayersFromPool(globalIds) {
  if (players.length >= 16) { alert('最多只能有16名选手'); return; }
  const spaceLeft = 16 - players.length;
  const selected = globalPlayers.filter(gp => globalIds.includes(gp.id) && !players.some(p => p.globalId === gp.id));
  const toAdd = selected.slice(0, spaceLeft);
  toAdd.forEach(gp => {
    players.push({
      id: nextPlayerId++,
      name: gp.name,
      team: gp.teamName,
      color: gp.color,
      globalId: gp.id,
      teamId: gp.teamId,
      wins: 0, losses: 0, pf: 0, pa: 0,
      status: 'active',
      matchHistory: []
    });
  });
  saveCurrentTournamentData();
  renderPlayerList();
  playSound('add');
}

function getLeaderboard() {
  const rankings = globalPlayers.map(gp => {
    let totalScore = 0, totalWins = 0, totalLosses = 0, championships = 0, tournamentCount = 0, totalNetScore = 0;
    tournaments.forEach(t => {
      if (t.players && t.players.some(p => p.globalId === gp.id)) tournamentCount++;
    });
    tournaments.forEach(t => {
      if (t.champion) {
        const championPlayer = t.players.find(p => p.id === t.champion);
        if (championPlayer && championPlayer.globalId === gp.id) championships++;
      }
    });
    globalMatchHistory.forEach(m => {
      if (m.p1.globalId === gp.id) {
        totalScore += m.p1Score || 0;
        totalNetScore += (m.p1Score - m.p2Score) || 0;
        if (m.winnerId === m.p1.id) totalWins++; else totalLosses++;
      }
      if (m.p2.globalId === gp.id) {
        totalScore += m.p2Score || 0;
        totalNetScore += (m.p2Score - m.p1Score) || 0;
        if (m.winnerId === m.p2.id) totalWins++; else totalLosses++;
      }
    });
    const totalPoints = Math.round((gp.elo || 1200) + championships * 200 + totalWins * 10 - totalLosses * 3 + totalNetScore * 0.5);
    return { ...gp, totalScore, totalNetScore, totalWins, totalLosses, tournamentCount, championships, totalPoints };
  });
  return rankings.sort((a, b) => {
    if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints;
    if (b.championships !== a.championships) return b.championships - a.championships;
    if (b.elo !== a.elo) return b.elo - a.elo;
    if (b.totalWins !== a.totalWins) return b.totalWins - a.totalWins;
    return a.name.localeCompare(b.name);
  });
}

function getTeamLeaderboard() {
  const teamStats = teams.map(team => {
    const teamPlayers = globalPlayers.filter(gp => gp.teamId === team.id);
    let totalWins = 0, totalLosses = 0, championships = 0, totalElo = 0;
    const playerCount = teamPlayers.length;
    teamPlayers.forEach(gp => {
      totalElo += gp.elo || 1200;
      totalWins += gp.totalWins || 0;
      totalLosses += gp.totalLosses || 0;
      championships += gp.championships || 0;
    });
    const avgElo = playerCount > 0 ? Math.round(totalElo / playerCount) : 1200;
    const teamPoints = Math.round(avgElo + championships * 300 + totalWins * 10 - totalLosses * 3);
    return { id: team.id, name: team.name, color: team.color, playerCount, avgElo, totalWins, totalLosses, championships, teamPoints };
  });
  return teamStats.sort((a, b) => {
    if (b.teamPoints !== a.teamPoints) return b.teamPoints - a.teamPoints;
    if (b.championships !== a.championships) return b.championships - a.championships;
    if (b.avgElo !== a.avgElo) return b.avgElo - a.avgElo;
    return a.name.localeCompare(b.name);
  });
}

function getHeadToHead(player1Id, player2Id) {
  const p1 = getPlayer(player1Id);
  const p2 = getPlayer(player2Id);
  if (!p1 || !p2) return null;
  const history = [];
  let p1Wins = 0, p2Wins = 0;
  globalMatchHistory.forEach(m => {
    const p1GlobalId = p1.globalId;
    const p2GlobalId = p2.globalId;
    if (m.p1.globalId === p1GlobalId && m.p2.globalId === p2GlobalId) {
      history.push({ tournamentName: m.tournamentName || '未知赛事', roundLabel: m.roundLabel, p1Score: m.p1Score, p2Score: m.p2Score, winner: m.winnerId === m.p1.id ? p1.name : p2.name });
      if (m.winnerId === m.p1.id) p1Wins++; else p2Wins++;
    } else if (m.p1.globalId === p2GlobalId && m.p2.globalId === p1GlobalId) {
      history.push({ tournamentName: m.tournamentName || '未知赛事', roundLabel: m.roundLabel, p1Score: m.p2Score, p2Score: m.p1Score, winner: m.winnerId === m.p2.id ? p1.name : p2.name });
      if (m.winnerId === m.p2.id) p1Wins++; else p2Wins++;
    }
  });
  const total = p1Wins + p2Wins;
  return {
    p1: { name: p1.name, wins: p1Wins, winRate: total > 0 ? Math.round(p1Wins / total * 100) : 0 },
    p2: { name: p2.name, wins: p2Wins, winRate: total > 0 ? Math.round(p2Wins / total * 100) : 0 },
    total, history
  };
}

function getPlayerAchievements(playerId) {
  const player = getPlayer(playerId);
  if (!player) return [];
  const achievements = [];
  const pGlobalId = player.globalId;
  tournaments.forEach(t => {
    if (t.champion) {
      const champPlayer = t.players.find(p => p.id === t.champion);
      if (champPlayer && champPlayer.globalId === pGlobalId) achievements.push(`🏆 ${t.name} 冠军 (${t.tier})`);
    }
  });
  let totalWins = 0, totalMatches = 0, highestScore = 0;
  globalMatchHistory.forEach(m => {
    if (m.p1.globalId === pGlobalId) {
      totalMatches++;
      if (m.winnerId === m.p1.id) totalWins++;
      if (m.p1Score > highestScore) highestScore = m.p1Score;
    }
    if (m.p2.globalId === pGlobalId) {
      totalMatches++;
      if (m.winnerId === m.p2.id) totalWins++;
      if (m.p2Score > highestScore) highestScore = m.p2Score;
    }
  });
  if (totalWins > 0) achievements.push(`✅ 总胜场: ${totalWins}`);
  if (totalMatches > 0) achievements.push(`📊 总比赛数: ${totalMatches}`);
  if (highestScore > 0) achievements.push(`🔥 最高单场得分: ${highestScore}`);
  return achievements;
}

function getAdjustedWinProbability(playerA, playerB) {
  const gpA = getGlobalPlayerById(playerA.globalId);
  const gpB = getGlobalPlayerById(playerB.globalId);
  if (!gpA || !gpB) return 0.5;
  const eloProb = 1 / (1 + Math.pow(10, (gpB.elo - gpA.elo) / 400));
  const h2h = getHeadToHead(playerA.id, playerB.id);
  if (h2h && h2h.total > 0) {
    const h2hWinRate = h2h.p1.wins / h2h.total;
    return eloProb * 0.7 + h2hWinRate * 0.3;
  }
  return eloProb;
}

function clearAllData() {
  if (!confirm('确定删除所有数据（包括所有赛事、选手、队伍、历史记录）？此操作不可恢复！')) return;
  if (!confirm('再次确认：真的要删除全部数据吗？')) return;
  teams = [];
  globalPlayers = [];
  tournaments = [];
  globalMatchHistory = [];
  currentTournamentId = null;
  currentTournament = null;
  players = [];
  allMatches = [];
  swissRound = 0;
  currentPhase = 'setup';
  swissMatches = [];
  playoffStage = 0;
  currentPlayoffMatches = [];
  qfMatches = [];
  sfMatches = [];
  finalMatch = null;

}

function addPlayer() {
  const nameInput = $('#playerName');
  const teamSelect = $('#teamSelect');
  const newTeamInput = $('#newTeamNameInput');
  const name = nameInput.value.trim();
  const teamValue = teamSelect.value;
  if (!name) { alert('请填写选手名称'); return; }
  let teamName = '', teamId = null;
  if (teamValue === '__new__') {
    teamName = newTeamInput.value.trim();
    if (!teamName) { alert('请输入新队伍名称'); return; }
    const team = getOrCreateTeam(teamName);
    teamId = team.id;
  } else if (teamValue) {
    const team = getTeamById(teamValue);
    if (team) { teamName = team.name; teamId = team.id; }
  } else { alert('请选择队伍或新建队伍'); return; }
  if (players.length >= 16) { alert('最多只能有16名选手'); return; }
  if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) { alert('该选手已存在'); return; }
  const gp = getOrCreateGlobalPlayer(name, teamId, teamName);
  const team = getTeamById(teamId);
  players.push({
    id: nextPlayerId++,
    name,
    team: teamName,
    color: team ? team.color : gp.color,
    globalId: gp.id,
    teamId: teamId,
    wins: 0, losses: 0, pf: 0, pa: 0,
    status: 'active',
    matchHistory: []
  });
  nameInput.value = '';
  newTeamInput.value = '';
  newTeamInput.style.display = 'none';
  saveCurrentTournamentData();
  playSound('add');
  renderPlayerList();
  updateTeamSelect();
}

function renderPlayerList() {
  const container = $('#playerList');
  if (!container) return;
  container.innerHTML = '';
  players.forEach(p => {
    const li = document.createElement('li');
    li.className = 'player-item';
    li.innerHTML = `
      <span class="color-dot" style="background:${p.color}"></span>
      <span>${p.name}</span>
      <small>${p.team}</small>
      <button class="remove-btn" data-id="${p.id}">✕</button>
    `;
    li.querySelector('.remove-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(e.target.dataset.id);
      players = players.filter(p => p.id !== id);
      saveCurrentTournamentData();
      playSound('delete');
      renderPlayerList();
      updateTeamSelect();
    });
    li.addEventListener('click', () => { showPlayerModal(p.id); });
    container.appendChild(li);
  });
  const countEl = $('#playerCount');
  if (countEl) countEl.textContent = players.length;
  const startBtn = $('#startBtn');
  if (startBtn) startBtn.disabled = players.length !== 16;
}

function startTournament() {
  if (players.length !== 16) { alert('请确保正好有16名选手'); return; }
  players.forEach(p => { p.wins=0; p.losses=0; p.pf=0; p.pa=0; p.status='active'; p.matchHistory=[]; });
  allMatches = [];
  swissRound = 0;
  currentPhase = 'swiss';
  currentPlayoffMatches = [];
  qfMatches = [];
  sfMatches = [];
  finalMatch = null;
  champion = null;
  saveCurrentTournamentData();
  $('#setupScreen').classList.add('hidden');
  $('#tournamentScreen').classList.remove('hidden');
  $('#summaryScreen').classList.add('hidden');
  generateSwissRound();
}

function pairSwissPlayers(activePlayers) {
  const groups = {};
  activePlayers.forEach(p => {
    const key = `${p.wins}:${p.losses}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });
  const groupKeys = Object.keys(groups).sort((a, b) => {
    const [aw, al] = a.split(':').map(Number);
    const [bw, bl] = b.split(':').map(Number);
    if (bw !== aw) return bw - aw;
    return al - bl;
  });
  const allShuffled = [];
  groupKeys.forEach(key => {
    shuffleArray(groups[key]);
    groups[key].forEach(p => allShuffled.push(p));
  });
  const pairings = [];
  for (let i = 0; i < allShuffled.length; i += 2) {
    if (i + 1 < allShuffled.length) {
      let p1 = allShuffled[i], p2 = allShuffled[i+1];
      const p1Opp = getOpponents(p1.id);
      if (p1Opp.has(p2.id)) {
        for (let j = i+2; j < allShuffled.length; j++) {
          const candidate = allShuffled[j];
          if (!p1Opp.has(candidate.id) && !getOpponents(candidate.id).has(p2.id)) {
            [allShuffled[i+1], allShuffled[j]] = [allShuffled[j], allShuffled[i+1]];
            p2 = allShuffled[i+1];
            break;
          }
        }
      }
      const label = (p1.wins === p2.wins && p1.losses === p2.losses) ? `${p1.wins}:${p1.losses}` : `${p1.wins}:${p1.losses} vs ${p2.wins}:${p2.losses}`;
      pairings.push({ id: `S${swissRound}-${pairings.length+1}`, group: label, p1, p2, p1Score: null, p2Score: null, winnerId: null });
    }
  }
  return pairings;
}

function generateSwissRound() {
  const active = players.filter(p => p.status === 'active');
  if (active.length === 0) {
    if (players.filter(p => p.status === 'advanced').length >= 8) startPlayoffs();
    return;
  }
  swissRound++;
  swissMatches = pairSwissPlayers(active);
  updateUI();
}

function updateUI() {
  renderStandings();
  renderSwissMatches();
  renderBracket();
  renderPrediction();
  if (currentPhase === 'swiss') {
    $('#phaseTitle').textContent = '瑞士轮阶段';
    $('#roundInfo').textContent = `第 ${swissRound} 轮`;
    $('#matchPanelTitle').textContent = `第 ${swissRound} 轮对阵`;
    $('#submitRoundBtn').classList.remove('hidden');
    $('#playoffSection').classList.add('hidden');
    $('#matchPanel').classList.remove('hidden');
  } else if (currentPhase === 'playoff') {
    $('#phaseTitle').textContent = '淘汰赛阶段';
    $('#roundInfo').textContent = '单败淘汰';
    $('#submitRoundBtn').classList.add('hidden');
    $('#playoffSection').classList.remove('hidden');
    $('#matchPanel').classList.add('hidden');
  }
  saveCurrentTournamentData();
}

function renderSwissMatches() {
  const container = $('#matchList');
  if (!container) return;
  container.innerHTML = '';

function createMatchCard(match) {

  if (h2h && h2h.total > 0) {

  }
  card.innerHTML = `
    <div class="match-header"><span>${match.group || match.roundLabel}</span><span>${match.roundLabel || '瑞士轮'}</span></div>
    ${h2hHtml}
    <div class="match-teams">
      <div>
        <div class="team-name" data-player-id="${match.p1.id}"><span class="color-dot" style="background:${match.p1.color}"></span>${match.p1.name}</div>
        <div class="team-org">${match.p1.team}</div>
      </div>
      <div class="vs">VS</div>
      <div>
        <div class="team-name" data-player-id="${match.p2.id}"><span class="color-dot" style="background:${match.p2.color}"></span>${match.p2.name}</div>
        <div class="team-org">${match.p2.team}</div>
      </div>

      <span style="color:#c9bfff;">:</span>
      <input type="number" class="score p2score" placeholder="分数" min="0" value="${match.p2Score ?? ''}" />
      <span class="winner-hint" style="color:#00ff88;font-weight:bold;"></span>
    </div>
  `;

function renderStandings() {
  const container = $('#swissStandings');
  if (!container) return;
  container.innerHTML = '';
  const groupOrder = ['0:0','1:0','0:1','2:0','1:1','0:2','2:1','1:2','2:2','3:0','3:1','3:2','0:3','1:3','2:3'];
  const groups = {};
  players.forEach(p => {
    const key = `${p.wins}:${p.losses}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });
  let tableHtml = '<table class="standings-table"><thead><tr><th>战绩</th><th>选手</th></tr></thead><tbody>';
  groupOrder.forEach(key => {
    if (!groups[key] || groups[key].length === 0) return;
    const group = groups[key];
    const [w, l] = key.split(':').map(Number);
    const isTerminal = w === 3 || l === 3;
    const playerTags = group.map(p => {
      const state = p.status === 'advanced' ? '🎫' : p.status === 'eliminated' ? '❌' : '';
      return `<span class="player-tag" data-player-id="${p.id}" title="${p.team}"><span class="color-dot" style="background:${p.color}"></span>${p.name} <span class="team">${p.team}</span> ${state}</span>`;
    }).join('<br>');
    tableHtml += `<tr class="${isTerminal ? 'group-row-terminal' : ''}"><td><strong>${key}</strong></td><td><div class="player-cell">${playerTags}</div></td></tr>`;
  });
