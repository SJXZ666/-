function renderRanking(container) {
  if (!container) return;
  const sorted = players.slice().sort((a, b) => {
    if (b.wins !== a.wins) return b.wins - a.wins;
    if (a.losses !== b.losses) return a.losses - b.losses;
    return (b.pf - b.pa) - (a.pf - a.pa);
  });
  let html = '<table class="ranking-table"><thead><tr><th>排名</th><th>选手</th><th>队伍</th><th>战绩</th><th>小分</th><th>净胜</th><th>ELO</th><th>状态</th></tr></thead><tbody>';
  sorted.forEach((p, idx) => {
    const gp = getGlobalPlayerById(p.globalId);
    const elo = gp ? gp.elo : 1200;
    const status = p.status === 'advanced' ? '晋级' : p.status === 'eliminated' ? '淘汰' : '进行中';
    html += `<tr class="clickable" data-player-id="${p.id}"><td>${idx+1}</td><td><span class="color-dot" style="background:${p.color}"></span> ${p.name}</td><td>${p.team}</td><td>${p.wins}:${p.losses}</td><td>${p.pf}:${p.pa}</td><td>${p.pf-p.pa}</td><td>${elo}</td><td>${status}</td></tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
  container.querySelectorAll('tr.clickable').forEach(row => {
    row.addEventListener('click', () => { showPlayerModal(Number(row.dataset.playerId)); });
  });
}

function renderPrediction() {
  const container = $('#predictionContainer');
  if (!container) return;
  const hasHistory = globalMatchHistory.length > 0;
  if (!hasHistory && currentPhase === 'swiss' && swissRound === 1) {
    container.innerHTML = '<p style="color:#c9bfff;">暂无历史数据，冠军预测将在有比赛记录后开启。</p>';
    return;
  }
  let candidates = [];
  if (currentPhase === 'swiss') candidates = players.filter(p => p.status === 'active' || p.status === 'advanced');
  else if (currentPhase === 'playoff') {
    if (currentPlayoffMatches.length > 0) candidates = currentPlayoffMatches.flatMap(m => [m.p1, m.p2]);
    else candidates = players.filter(p => p.status === 'advanced');
  } else if (currentPhase === 'done') candidates = players;
  if (candidates.length === 0) { container.innerHTML = '<p>暂无候选选手。</p>'; return; }
  const sims = 800;
  const champCount = {};
  candidates.forEach(p => { champCount[p.id] = 0; });
  for (let sim = 0; sim < sims; sim++) {
    let pool = candidates.map(p => ({ ...p }));
    while (pool.length > 1) {
      const nextRound = [];
      shuffleArray(pool);
      for (let i = 0; i < pool.length; i += 2) {
        if (i+1 >= pool.length) { nextRound.push(pool[i]); continue; }
        const p1 = pool[i], p2 = pool[i+1];
        const prob1 = getAdjustedWinProbability(p1, p2);
        nextRound.push(Math.random() < prob1 ? p1 : p2);
      }
      pool = nextRound;
    }
    if (pool.length === 1) champCount[pool[0].id]++;
  }
  const sortedCandidates = candidates.slice().sort((a, b) => (champCount[b.id] || 0) - (champCount[a.id] || 0));
  const top3 = sortedCandidates.slice(0, 3);
  let html = '<p style="font-size:16px;font-weight:bold;color:#00f0ff;">SAI预测的冠军选手为：</p>';
  top3.forEach((p, idx) => {
    const prob = Math.round((champCount[p.id] || 0) / sims * 100);
    const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉';
    html += `<div style="margin:8px 0;padding:10px;background:rgba(0,240,255,0.1);border-radius:8px;">${medal} <span class="color-dot" style="background:${p.color}"></span> <strong>${p.name}</strong> (${p.team}) - 概率: <span style="color:${prob > 30 ? '#00ff88' : '#c9bfff'};font-weight:bold;">${prob}%</span></div>`;
  });
  container.innerHTML = html;
}

function submitSwissRound() {
  if (swissMatches.length === 0) return;
  for (const match of swissMatches) {
    const card = document.querySelector(`#matchList .match-card[data-id="${match.id}"]`);
    if (!card) { alert('找不到比赛卡片'); return; }
    const p1Score = parseInt(card.querySelector('.p1score').value);
    const p2Score = parseInt(card.querySelector('.p2score').value);
    if (isNaN(p1Score) || isNaN(p2Score)) { alert(`请完整填写 ${match.p1.name} vs ${match.p2.name} 的分数`); return; }
    if (p1Score === p2Score) { alert('不允许平局，请重新输入分数'); return; }
    match.p1Score = p1Score;
    match.p2Score = p2Score;
    match.winnerId = p1Score > p2Score ? match.p1.id : match.p2.id;
  }
  swissMatches.forEach(match => applyResult(match, 'swiss'));
  swissMatches = [];
  playSound('submit');
  const advancedCount = players.filter(p => p.status === 'advanced').length;
  if (advancedCount >= 8) startPlayoffs();
  else if (players.some(p => p.status === 'active')) generateSwissRound();
  else { alert('瑞士轮结束但晋级人数不足8'); playSound('error'); }
}

function submitPlayoffRound() {
  if (currentPlayoffMatches.length === 0) return;
  for (const match of currentPlayoffMatches) {
    const card = document.querySelector(`#playoffMatchList .match-card[data-id="${match.id}"]`);
    if (!card) { alert('找不到淘汰赛比赛卡片'); return; }
    const p1Score = parseInt(card.querySelector('.p1score').value);
    const p2Score = parseInt(card.querySelector('.p2score').value);
    if (isNaN(p1Score) || isNaN(p2Score)) { alert(`请完整填写 ${match.p1.name} vs ${match.p2.name} 的分数`); return; }
    if (p1Score === p2Score) { alert('不允许平局，请重新输入分数'); return; }
    match.p1Score = p1Score;
    match.p2Score = p2Score;
    match.winnerId = p1Score > p2Score ? match.p1.id : match.p2.id;
  }
  currentPlayoffMatches.forEach(match => applyResult(match, 'playoff'));
  playSound('submit');
  if (playoffStage === 0) {
    const winners = currentPlayoffMatches.map(m => getPlayer(m.winnerId));
    if (winners.some(w => !w)) return;
    sfMatches = [
      { id: 'SF1', roundLabel: '半决赛', p1: winners[0], p2: winners[1], winnerId: null, p1Score: null, p2Score: null },
      { id: 'SF2', roundLabel: '半决赛', p1: winners[2], p2: winners[3], winnerId: null, p1Score: null, p2Score: null }
    ];
    currentPlayoffMatches = sfMatches;
    playoffStage = 1;
    renderPlayoffMatches(); renderBracket(); updateUI();
  } else if (playoffStage === 1) {
    const winners = currentPlayoffMatches.map(m => getPlayer(m.winnerId));
    if (winners.some(w => !w)) return;
    finalMatch = { id: 'FINAL', roundLabel: '决赛', p1: winners[0], p2: winners[1], winnerId: null, p1Score: null, p2Score: null };
    currentPlayoffMatches = [finalMatch];
    playoffStage = 2;
    renderPlayoffMatches(); renderBracket(); updateUI();
  } else if (playoffStage === 2) {
    finalMatch = currentPlayoffMatches[0];
    champion = getPlayer(finalMatch.winnerId);
    currentPhase = 'done';
    renderBracket(); renderSummary();
    playSound('win');
  }
}

function applyResult(match, stage) {
  const p1 = match.p1, p2 = match.p2;
  const winnerId = Number(match.winnerId);
  const winner = winnerId === p1.id ? p1 : p2;
  const loser = winnerId === p1.id ? p2 : p1;
  const winnerScore = winnerId === p1.id ? match.p1Score : match.p2Score;
  const loserScore = winnerId === p1.id ? match.p2Score : match.p1Score;
  winner.wins++;
  loser.losses++;
  winner.pf += Number(winnerScore);
  winner.pa += Number(loserScore);
  loser.pf += Number(loserScore);
  loser.pa += Number(winnerScore);
  const roundLabel = stage === 'swiss' ? `瑞士轮R${swissRound}` : match.roundLabel || '淘汰赛';
  const matchRecord = {
    id: match.id,
    stage,
    roundLabel,
    tournamentName: currentTournament ? currentTournament.name : '未知赛事',
    tier: currentTournament ? currentTournament.tier : 'T2',
    p1: { id: p1.id, name: p1.name, team: p1.team, color: p1.color, globalId: p1.globalId, teamId: p1.teamId },
    p2: { id: p2.id, name: p2.name, team: p2.team, color: p2.color, globalId: p2.globalId, teamId: p2.teamId },
    p1Score: Number(match.p1Score),
    p2Score: Number(match.p2Score),
    winnerId: Number(winnerId),
    timestamp: Date.now()
  };
  allMatches.push(matchRecord);
  globalMatchHistory.push(matchRecord);
  winner.matchHistory.push(matchRecord.id);
  loser.matchHistory.push(matchRecord.id);
  if (stage === 'swiss') {
    if (winner.wins >= 3) winner.status = 'advanced';
    if (loser.losses >= 3) loser.status = 'eliminated';
  } else {
    winner.status = 'advanced';
    loser.status = 'eliminated';
  }
  updateGlobalElo(winner, loser, winnerScore, loserScore);
  saveCurrentTournamentData();
}

function updateGlobalElo(winner, loser, winnerScore, loserScore) {
  const gpWin = getGlobalPlayerById(winner.globalId);
  const gpLose = getGlobalPlayerById(loser.globalId);
  if (!gpWin || !gpLose) return;
  const winElo = gpWin.elo || 1200;
  const loseElo = gpLose.elo || 1200;
  const expectedWin = 1 / (1 + Math.pow(10, (loseElo - winElo) / 400));
  const diff = Math.abs(winnerScore - loserScore);
  let kFactor = 32;
  if (diff <= 3) kFactor *= 0.8;
  else if (diff >= 10) kFactor *= 1.5;
  const tier = currentTournament ? currentTournament.tier : 'T2';
  if (tier === 'T1') kFactor *= 1.5;
  else if (tier === 'T3') kFactor *= 0.7;
  const rankings = getLeaderboard();
  const winRankIndex = rankings.findIndex(r => r.id === gpWin.id);
  const loseRankIndex = rankings.findIndex(r => r.id === gpLose.id);
  if (winRankIndex !== -1 && loseRankIndex !== -1) {
    const rankDiff = loseRankIndex - winRankIndex;
    if (rankDiff > 0) kFactor *= (1 + Math.min(0.8, rankDiff * 0.1));
    else if (rankDiff < 0) kFactor *= (1 - Math.min(0.4, Math.abs(rankDiff) * 0.05));
  }
  const delta = Math.round(kFactor * (1 - expectedWin));
  gpWin.elo = winElo + delta;
  gpLose.elo = loseElo - delta;
  gpWin.matchCount = (gpWin.matchCount || 0) + 1;
  gpLose.matchCount = (gpLose.matchCount || 0) + 1;
  gpWin.totalWins = (gpWin.totalWins || 0) + 1;
  gpLose.totalLosses = (gpLose.totalLosses || 0) + 1;
  saveData();
}

function startPlayoffs() {
  currentPhase = 'playoff';
  playoffStage = 0;
  const advanced = players.filter(p => p.status === 'advanced');
  if (advanced.length !== 8) { alert('晋级人数不是8，无法开始淘汰赛'); return; }
  const seeds = advanced.slice().sort((a, b) => {
    if (a.losses !== b.losses) return a.losses - b.losses;
    const diffA = a.pf - a.pa;
    const diffB = b.pf - b.pa;
    if (diffA !== diffB) return diffB - diffA;
    return a.id - b.id;
  });
  qfMatches = [
    { id: 'QF1', roundLabel: '八强赛', p1: seeds[0], p2: seeds[7], winnerId: null, p1Score: null, p2Score: null },
    { id: 'QF2', roundLabel: '八强赛', p1: seeds[3], p2: seeds[4], winnerId: null, p1Score: null, p2Score: null },
    { id: 'QF3', roundLabel: '八强赛', p1: seeds[1], p2: seeds[6], winnerId: null, p1Score: null, p2Score: null },
    { id: 'QF4', roundLabel: '八强赛', p1: seeds[2], p2: seeds[5], winnerId: null, p1Score: null, p2Score: null }
  ];
  currentPlayoffMatches = qfMatches;
  sfMatches = [];
  finalMatch = null;
  renderPlayoffMatches(); updateUI(); playSound('win');
}

function renderPlayoffMatches() {
  const container = $('#playoffMatchList');
  if (!container) return;
  container.innerHTML = '';
  currentPlayoffMatches.forEach(match => container.appendChild(createMatchCard(match)));
  const titleEl = $('#playoffRoundTitle');
  if (titleEl) titleEl.textContent = currentPlayoffMatches[0] ? currentPlayoffMatches[0].roundLabel : '';
  const submitBtn = $('#submitPlayoffBtn');
  if (submitBtn) submitBtn.classList.toggle('hidden', currentPlayoffMatches.length === 0 || currentPhase !== 'playoff');
}

function renderBracket() {
  const container = $('#bracketContainer');
  if (!container) return;
  if (currentPhase !== 'playoff' && currentPhase !== 'done') { container.innerHTML = ''; return; }
  container.innerHTML = '';
  const qfCol = createBracketColumn('八强', qfMatches);
  const sfCol = createBracketColumn('四强', sfMatches);
  const finalCol = createBracketColumn('决赛', finalMatch ? [finalMatch] : []);
  container.appendChild(qfCol);
  container.appendChild(sfCol);
  container.appendChild(finalCol);
  const championCol = document.createElement('div');
  championCol.className = 'bracket-col champion-col';
  championCol.innerHTML = '<h4>冠军</h4>';
  if (champion) championCol.innerHTML += `<div class="champion-card">冠军 ${champion.name} (${champion.team})</div>`;
  container.appendChild(championCol);
}

function createBracketColumn(title, matches) {
  const col = document.createElement('div');
  col.className = 'bracket-col';
  col.innerHTML = `<h4>${title}</h4>`;
  matches.forEach(m => {
    if (!m) return;
    const p1Winner = m.winnerId && Number(m.winnerId) === m.p1.id;
    const p2Winner = m.winnerId && Number(m.winnerId) === m.p2.id;
    const card = document.createElement('div');
    card.className = 'bracket-match';
    card.innerHTML = `
      <div class="bracket-player ${p1Winner ? 'winner' : ''}" data-player-id="${m.p1.id}"><span class="color-dot" style="background:${m.p1.color}"></span>${m.p1.name} <small>${m.p1.team}</small></div>
      <div class="bracket-score">${m.p1Score !== null && m.p2Score !== null ? `${m.p1Score}:${m.p2Score}` : 'VS'}</div>
      <div class="bracket-player ${p2Winner ? 'winner' : ''}" data-player-id="${m.p2.id}"><span class="color-dot" style="background:${m.p2.color}"></span>${m.p2.name} <small>${m.p2.team}</small></div>
    `;
    col.appendChild(card);
    card.querySelectorAll('.bracket-player').forEach(el => {
      el.addEventListener('click', () => { showPlayerModal(Number(el.dataset.playerId)); });
    });
  });
  return col;
}

function renderSummary() {
  $('#setupScreen').classList.add('hidden');
  $('#tournamentScreen').classList.add('hidden');
  $('#summaryScreen').classList.remove('hidden');
  $('#leaderboardScreen').classList.add('hidden');
  $('#playerPoolScreen').classList.add('hidden');
  const championEl = $('#championDisplay');
  if (championEl) {
    if (champion) championEl.innerHTML = `<div class="champion-card">冠军：${champion.name} (${champion.team})</div>`;
    else championEl.innerHTML = '';
  }
  const sorted = players.slice().sort((a, b) => {
    if (champion) { if (a.id === champion.id) return -1; if (b.id === champion.id) return 1; }
    if (a.status === 'advanced' && b.status !== 'advanced') return -1;
    if (b.status === 'advanced' && a.status !== 'advanced') return 1;
    if (b.wins !== a.wins) return b.wins - a.wins;
    if (a.losses !== b.losses) return a.losses - b.losses;
    return (b.pf - b.pa) - (a.pf - a.pa);
  });
  const container = $('#summaryContainer');
  if (!container) return;
  container.innerHTML = sorted.map(p => {
    const history = p.matchHistory.map(matchId => {
      const match = allMatches.find(m => m.id === matchId);
      if (!match) return '';
      const isP1 = match.p1.id === p.id;
      const isWinner = match.winnerId === p.id;
      const opponent = isP1 ? match.p2 : match.p1;
      const myScore = isP1 ? match.p1Score : match.p2Score;
      const oppScore = isP1 ? match.p2Score : match.p1Score;
      return `<li>${match.roundLabel}：${isWinner ? '胜' : '负'} ${opponent.name}（${myScore}:${oppScore}）</li>`;
    }).join('');
    const gp = getGlobalPlayerById(p.globalId);
    const elo = gp ? gp.elo : 1200;
    return `<div class="summary-card ${champion && p.id === champion.id ? 'champion' : ''}"><h3><span class="color-dot" style="background:${p.color}"></span> ${p.name} <span>${p.team}</span></h3><p class="record">最终战绩：${p.wins} : ${p.losses} | 总小分：${p.pf} : ${p.pa} | 净胜分：${p.pf - p.pa} | ELO：${elo}</p><ul class="history">${history || '<li>无比赛记录</li>'}</ul></div>`;
  }).join('');
}

function showTotalSummary() {
  const modal = $('#totalSummaryModal');
  const body = $('#totalSummaryBody');
  if (!modal || !body) return;
  let html = '';
  if (currentPhase === 'setup') {
    html = '<p>赛事尚未开始。</p>';
  } else {
    const sorted = players.slice().sort((a, b) => {
      if (b.wins !== a.wins) return b.wins - a.wins;
      if (a.losses !== b.losses) return a.losses - b.losses;
      return (b.pf - b.pa) - (a.pf - a.pa);
    });
    html = '<h3>当前排名</h3><table class="ranking-table"><thead><tr><th>排名</th><th>选手</th><th>战绩</th><th>小分</th></tr></thead><tbody>';
    sorted.forEach((p, idx) => { html += `<tr><td>${idx+1}</td><td>${p.name}</td><td>${p.wins}:${p.losses}</td><td>${p.pf}:${p.pa}</td></tr>`; });
    html += '</tbody></table><h3>已完成的比赛</h3>';
    if (allMatches.length === 0) html += '<p>暂无比赛。</p>';
    else allMatches.forEach(m => { html += `<div style="padding:5px 0;border-bottom:1px dashed rgba(255,255,255,0.1);">${m.roundLabel}: ${m.p1.name} ${m.p1Score}:${m.p2Score} ${m.p2.name}</div>`; });
  }
  body.innerHTML = html;
  modal.classList.remove('hidden');
}

function showHistoryModal() {
  const modal = $('#historyModal');
  const list = $('#historyListContainer');
  if (!modal || !list) return;
  list.innerHTML = '';
  if (globalMatchHistory.length === 0) list.innerHTML = '<p>暂无比赛记录。</p>';
  else {
    globalMatchHistory.slice().reverse().forEach(m => {
      const div = document.createElement('div');
      div.className = 'history-match-item';
      div.innerHTML = `<div class="history-match-info"><strong>${m.tournamentName || '未知赛事'}</strong> (${m.tier}) - ${m.roundLabel} - ${m.p1.name} <span class="score">${m.p1Score}:${m.p2Score}</span> ${m.p2.name} <small>（胜者：${m.winnerId === m.p1.id ? m.p1.name : m.p2.name}）</small></div>`;
      list.appendChild(div);
    });
  }
  modal.classList.remove('hidden');
  playSound('click');
}

function showPlayerModal(playerId) {
  const player = getPlayer(playerId);
  if (!player) return;
  const modal = $('#playerModal');
  const title = $('#playerModalTitle');
  const body = $('#playerModalBody');
  if (!modal || !title || !body) return;
  title.innerHTML = `<span class="color-dot" style="background:${player.color}"></span> ${player.name} <small>${player.team}</small>`;
  const pGlobalId = player.globalId;
  const playerGlobalMatches = globalMatchHistory.filter(m => m.p1.globalId === pGlobalId || m.p2.globalId === pGlobalId);
  let historyHtml = '';
  playerGlobalMatches.forEach(m => {
    const isP1 = m.p1.globalId === pGlobalId;
    const isWinner = m.winnerId === (isP1 ? m.p1.id : m.p2.id);
    const opponent = isP1 ? m.p2 : m.p1;
    const myScore = isP1 ? m.p1Score : m.p2Score;
    const oppScore = isP1 ? m.p2Score : m.p1Score;
    historyHtml += `<li>${m.tournamentName} ${m.roundLabel}：${isWinner ? '胜' : '负'} ${opponent.name}（${myScore}:${oppScore}）</li>`;
  });
  const gp = getGlobalPlayerById(pGlobalId);
  const elo = gp ? gp.elo : 1200;
  const achievements = getPlayerAchievements(playerId);
  const achievementsHtml = achievements.length > 0 ? achievements.map(a => `<li>${a}</li>`).join('') : '<li>暂无成就</li>';
  body.innerHTML = `<div class="record"><strong>当前赛事战绩：</strong>${player.wins}胜 ${player.losses}负<br><strong>总小分：</strong>${player.pf}:${player.pa}<br><strong>净胜分：</strong>${player.pf - player.pa}<br><strong>ELO：</strong>${elo}<br><strong>状态：</strong>${player.status === 'advanced' ? '已晋级' : player.status === 'eliminated' ? '已淘汰' : '进行中'}</div><h3>成就</h3><ul class="history">${achievementsHtml}</ul><h3>全部历史比赛</h3><ul class="history">${historyHtml || '<li>暂无比赛记录</li>'}</ul>`;
  modal.classList.remove('hidden');
  playSound('click');
}

function restart() {
  if (!currentTournament) return;
  if (!confirm('重新开始将清空当前赛事的战绩，但会保留选手名单和历史记录。确定继续？')) return;
  currentTournament.players.forEach(p => { p.wins=0; p.losses=0; p.pf=0; p.pa=0; p.status='active'; p.matchHistory=[]; });
  allMatches = [];
  swissRound = 0;
  currentPhase = 'setup';
  playoffStage = 0;
  currentPlayoffMatches = [];
  qfMatches = [];
  sfMatches = [];
  finalMatch = null;
  champion = null;
  saveCurrentTournamentData();
  renderCurrentView();
  playSound('click');
}

// ==================== ui.js ====================
function renderCurrentView() {
  $('#setupScreen').classList.add('hidden');
  $('#tournamentScreen').classList.add('hidden');
  $('#summaryScreen').classList.add('hidden');
  $('#leaderboardScreen').classList.add('hidden');
  $('#playerPoolScreen').classList.add('hidden');
  if (currentPhase === 'setup') $('#setupScreen').classList.remove('hidden');
  else if (currentPhase === 'done') { $('#summaryScreen').classList.remove('hidden'); renderSummary(); }
  else { $('#tournamentScreen').classList.remove('hidden'); updateUI(); }
  renderPlayerList();
  updateTeamSelect();
}

function updateTeamSelect() {
  const teamSelect = $('#teamSelect');
  const poolTeamSelect = $('#poolTeamSelect');
  if (!teamSelect && !poolTeamSelect) return;
  const optionsHtml = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  const fullOptions = `<option value="">-- 选择队伍 --</option>${optionsHtml}<option value="__new__">新建队伍...</option>`;
  if (teamSelect) {
    const currentVal = teamSelect.value;
    teamSelect.innerHTML = fullOptions;
    if (currentVal && teams.some(t => t.id === currentVal)) teamSelect.value = currentVal;
  }
  if (poolTeamSelect) {
    const currentVal = poolTeamSelect.value;
    poolTeamSelect.innerHTML = fullOptions;
    if (currentVal && teams.some(t => t.id === currentVal)) poolTeamSelect.value = currentVal;
  }
}

let currentLeaderboardView = 'player';
function renderLeaderboard() {
  const container = $('#leaderboardContainer');
  if (!container) return;
  if (currentLeaderboardView === 'player') renderPlayerLeaderboard(container);
  else renderTeamLeaderboard(container);
}

function renderPlayerLeaderboard(container) {
  const rankings = getLeaderboard();
  if (rankings.length === 0) { container.innerHTML = '<p>暂无选手数据</p>'; return; }
  let html = '<table class="ranking-table"><thead><tr><th>排名</th><th>选手</th><th>队伍</th><th>ELO</th><th>总胜场</th><th>总负场</th><th>净胜分</th><th>参赛次数</th><th>冠军次数</th><th>综合积分</th></tr></thead><tbody>';
  rankings.forEach((p, idx) => {
    const team = getTeamById(p.teamId);
    const teamName = team ? team.name : (p.teamName || '未知队伍');
    html += `<tr class="clickable" data-gp-id="${p.id}"><td>${idx+1}</td><td><span class="color-dot" style="background:${p.color}"></span> ${p.name}</td><td>${teamName}</td><td>${p.elo}</td><td>${p.totalWins||0}</td><td>${p.totalLosses||0}</td><td>${p.totalNetScore||0}</td><td>${p.tournamentCount}</td><td>${p.championships}</td><td>${p.totalPoints}</td></tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
  container.querySelectorAll('tr.clickable').forEach(row => {
    row.addEventListener('click', () => { showGlobalPlayerModal(row.dataset.gpId); });
  });
}

function renderTeamLeaderboard(container) {
  const rankings = getTeamLeaderboard();
  if (rankings.length === 0) { container.innerHTML = '<p>暂无队伍数据</p>'; return; }
  let html = '<table class="ranking-table"><thead><tr><th>排名</th><th>队伍</th><th>选手数</th><th>平均ELO</th><th>总胜场</th><th>总负场</th><th>冠军次数</th><th>队伍积分</th></tr></thead><tbody>';
  rankings.forEach((t, idx) => {
    html += `<tr><td>${idx+1}</td><td><span class="color-dot" style="background:${t.color}"></span> ${t.name}</td><td>${t.playerCount}</td><td>${t.avgElo}</td><td>${t.totalWins}</td><td>${t.totalLosses}</td><td>${t.championships}</td><td>${t.teamPoints}</td></tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function showLeaderboard() {
  $('#setupScreen').classList.add('hidden');
  $('#tournamentScreen').classList.add('hidden');
  $('#summaryScreen').classList.add('hidden');
  $('#playerPoolScreen').classList.add('hidden');
  $('#leaderboardScreen').classList.remove('hidden');
  currentLeaderboardView = 'player';
  $('#playerRankingTab').classList.add('active');
  $('#teamRankingTab').classList.remove('active');
  renderLeaderboard();
  playSound('click');
}

function hideLeaderboard() { renderCurrentView(); }

function renderPlayerPool() {
  const container = $('#playerPoolList');
  if (!container) return;
  container.innerHTML = '';
  if (globalPlayers.length === 0) { container.innerHTML = '<p>选手池为空，请添加选手。</p>'; return; }
  const listDiv = document.createElement('div');
  listDiv.className = 'player-pool-list';
  globalPlayers.forEach(gp => {
    const item = document.createElement('div');
    item.className = 'player-pool-item';
    const team = getTeamById(gp.teamId);
    const teamName = team ? team.name : (gp.teamName || '未知队伍');
    const teamColor = team ? team.color : gp.color;
    item.innerHTML = `<span class="color-dot" style="background:${teamColor}"></span><span>${gp.name}</span><small>${teamName}</small><span style="margin-left:10px;color:#c9bfff;">ELO:${gp.elo} 胜:${gp.totalWins||0} 负:${gp.totalLosses||0}</span><button class="remove-btn" data-gp-id="${gp.id}" style="margin-left:auto;">✕</button>`;
    item.querySelector('.remove-btn').addEventListener('click', (e) => { e.stopPropagation(); deletePlayerFromPool(gp.id); renderPlayerPool(); });
    item.addEventListener('click', () => { showGlobalPlayerModal(gp.id); });
    listDiv.appendChild(item);
  });
  container.appendChild(listDiv);
}

function showPlayerPool() {
  $('#setupScreen').classList.add('hidden');
  $('#tournamentScreen').classList.add('hidden');
  $('#summaryScreen').classList.add('hidden');
  $('#leaderboardScreen').classList.add('hidden');
  $('#playerPoolScreen').classList.remove('hidden');
  renderPlayerPool();
  renderTeamList();
  updateTeamSelect();
  playSound('click');
}

function hidePlayerPool() { renderCurrentView(); }

function addPlayerToPoolFromForm() {
  const name = $('#poolPlayerName').value.trim();
  const teamSelect = $('#poolTeamSelect');
  const newTeamInput = $('#poolNewTeamName');
  const teamValue = teamSelect.value;
  if (!name) { alert('请填写选手名称'); return; }
  let teamName = '', teamId = null;
  if (teamValue === '__new__') {
    teamName = newTeamInput.value.trim();
    if (!teamName) { alert('请输入新队伍名称'); return; }
    const team = getOrCreateTeam(teamName);
    teamId = team.id;
  } else if (teamValue) {
    const team = getTeamById(teamValue);
    if (team) { teamName = team.name; teamId = team.id; }
  } else { alert('请选择队伍或新建队伍'); return; }
  if (addPlayerToPool(name, teamId, teamName)) {
    $('#poolPlayerName').value = '';
    newTeamInput.value = '';
    newTeamInput.style.display = 'none';
    renderPlayerPool();
    updateTeamSelect();
    playSound('add');
  }
}

function renderTeamList() {
  const container = $('#teamList');
  if (!container) return;
  container.innerHTML = '';
  if (teams.length === 0) { container.innerHTML = '<p>暂无队伍，请添加。</p>'; return; }
  const listDiv = document.createElement('div');
  listDiv.className = 'player-pool-list';
  teams.forEach(team => {
    const item = document.createElement('div');
    item.className = 'player-pool-item';
    item.innerHTML = `<span class="color-dot" style="background:${team.color}"></span><span>${team.name}</span><button class="remove-btn" data-team-id="${team.id}" style="margin-left:auto;">✕</button>`;
    item.querySelector('.remove-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteTeam(team.id); renderTeamList(); renderPlayerPool(); updateTeamSelect(); });
    listDiv.appendChild(item);
  });
  container.appendChild(listDiv);
}

function addTeamFromForm() {
  const nameInput = $('#newTeamName');
  const name = nameInput.value.trim();
  if (!name) { alert('请输入队伍名称'); return; }
  if (createTeam(name)) { nameInput.value = ''; renderTeamList(); updateTeamSelect(); playSound('add'); }
}

function showSelectPlayersModal() {
  const modal = $('#selectPlayersModal');
  const container = $('#playerPoolCheckboxList');
  if (!modal || !container) return;
  const available = getAvailableGlobalPlayers();
  if (available.length === 0) { container.innerHTML = '<p>全局选手池中没有可选择的选手。</p>'; }
  else {
    let html = '<div class="checkbox-list">';
    available.forEach(gp => {
      const team = getTeamById(gp.teamId);
      const teamName = team ? team.name : (gp.teamName || '未知队伍');
      html += `<label class="checkbox-item"><input type="checkbox" value="${gp.id}" /><span class="color-dot" style="background:${gp.color}"></span><span>${gp.name}</span><small>${teamName} - ELO:${gp.elo}</small></label>`;
    });
    html += '</div>';
    container.innerHTML = html;
  }
  modal.classList.remove('hidden');
  playSound('click');
}

function confirmSelectPlayers() {
  const checkboxes = document.querySelectorAll('#playerPoolCheckboxList input[type="checkbox"]:checked');
  const selectedIds = Array.from(checkboxes).map(cb => cb.value);
  if (selectedIds.length === 0) { alert('请至少选择一名选手'); return; }
  addPlayersFromPool(selectedIds);
  $('#selectPlayersModal').classList.add('hidden');
  renderPlayerList();
  updateTeamSelect();
  playSound('add');
}

function showGlobalPlayerModal(gpId) {
  const gp = getGlobalPlayerById(gpId);
  if (!gp) return;
  const playerInCurrent = players.find(p => p.globalId === gpId);
  if (playerInCurrent) { showPlayerModal(playerInCurrent.id); return; }
  const modal = $('#playerModal');
  const title = $('#playerModalTitle');
  const body = $('#playerModalBody');
  if (!modal || !title || !body) return;
  const team = getTeamById(gp.teamId);
  const teamName = team ? team.name : (gp.teamName || '未知队伍');
  const teamColor = team ? team.color : gp.color;
  title.innerHTML = `<span class="color-dot" style="background:${teamColor}"></span> ${gp.name} <small>${teamName}</small>`;
  const playerGlobalMatches = globalMatchHistory.filter(m => m.p1.globalId === gpId || m.p2.globalId === gpId);
  let historyHtml = '';
  playerGlobalMatches.forEach(m => {
    const isP1 = m.p1.globalId === gpId;
    const isWinner = m.winnerId === (isP1 ? m.p1.id : m.p2.id);
    const opponent = isP1 ? m.p2 : m.p1;
    const myScore = isP1 ? m.p1Score : m.p2Score;
    const oppScore = isP1 ? m.p2Score : m.p1Score;
    historyHtml += `<li>${m.tournamentName} ${m.roundLabel}：${isWinner ? '胜' : '负'} ${opponent.name}（${myScore}:${oppScore}）</li>`;
  });
  body.innerHTML = `<div class="record"><strong>ELO：</strong>${gp.elo}<br><strong>总胜场：</strong>${gp.totalWins||0}<br><strong>总负场：</strong>${gp.totalLosses||0}<br><strong>总得分：</strong>${gp.totalScore||0}<br><strong>冠军次数：</strong>${gp.championships||0}</div><h3>历史比赛</h3><ul class="history">${historyHtml || '<li>暂无比赛记录</li>'}</ul>`;
  modal.classList.remove('hidden');
  playSound('click');
}

function showCurrentRanking() {
  const modal = $('#currentRankingModal');
  const body = $('#currentRankingBody');
  if (!modal || !body) return;
  renderRanking(body);
  modal.classList.remove('hidden');
  playSound('click');
}

function bindEvents() {
  $('#addPlayerBtn').addEventListener('click', addPlayer);
  $('#exampleBtn').addEventListener('click', fillExample);
  $('#importBtn').addEventListener('click', importFromGlobalPool);
  $('#startBtn').addEventListener('click', startTournament);
  $('#teamSelect').addEventListener('change', () => {
    const val = $('#teamSelect').value;
    const newTeamInput = $('#newTeamNameInput');
    if (val === '__new__') newTeamInput.style.display = 'block';
    else newTeamInput.style.display = 'none';
  });
  $('#poolTeamSelect').addEventListener('change', () => {
    const val = $('#poolTeamSelect').value;
    const newTeamInput = $('#poolNewTeamName');
    if (val === '__new__') newTeamInput.style.display = 'block';
    else newTeamInput.style.display = 'none';
  });
  $('#selectPlayersBtn').addEventListener('click', showSelectPlayersModal);
  $('#confirmSelectPlayersBtn').addEventListener('click', confirmSelectPlayers);
  $('#closeSelectPlayersBtn').addEventListener('click', () => { $('#selectPlayersModal').classList.add('hidden'); });
  $('#managePlayersBtn').addEventListener('click', showPlayerPool);
  $('#backFromPoolBtn').addEventListener('click', hidePlayerPool);
  $('#addPoolPlayerBtn').addEventListener('click', addPlayerToPoolFromForm);
  $('#addTeamBtn').addEventListener('click', addTeamFromForm);
  $('#submitRoundBtn').addEventListener('click', submitSwissRound);
  $('#submitPlayoffBtn').addEventListener('click', submitPlayoffRound);
  $('#restartBtn').addEventListener('click', restart);
  $('#totalSummaryBtn').addEventListener('click', showTotalSummary);
  $('#closeTotalSummaryBtn').addEventListener('click', () => { $('#totalSummaryModal').classList.add('hidden'); });
  $('#currentRankingBtn').addEventListener('click', showCurrentRanking);
  $('#closeCurrentRankingBtn').addEventListener('click', () => { $('#currentRankingModal').classList.add('hidden'); });
  $('#historyBtn').addEventListener('click', showHistoryModal);
  $('#leaderboardBtn').addEventListener('click', showLeaderboard);
  $('#backFromLeaderboardBtn').addEventListener('click', hideLeaderboard);
  $('#playerRankingTab').addEventListener('click', () => { currentLeaderboardView = 'player'; $('#playerRankingTab').classList.add('active'); $('#teamRankingTab').classList.remove('active'); renderLeaderboard(); });
  $('#teamRankingTab').addEventListener('click', () => { currentLeaderboardView = 'team'; $('#teamRankingTab').classList.add('active'); $('#playerRankingTab').classList.remove('active'); renderLeaderboard(); });
  $('#clearAllDataBtn').addEventListener('click', clearAllData);
  $('#closeHistoryBtn').addEventListener('click', () => { $('#historyModal').classList.add('hidden'); });
  $('#closePlayerModal').addEventListener('click', () => { $('#playerModal').classList.add('hidden'); });
  $('#createTournamentBtn').addEventListener('click', () => {
    const name = $('#newTournamentName').value.trim();
    const tier = $('#newTournamentTier').value;
    createTournament(name, tier);
    $('#newTournamentName').value = '';
  });
  $('#soundToggle').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    $('#soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
    if (soundEnabled) playSound('click');
  });
  $('#playerName').addEventListener('keydown', (e) => { if (e.key === 'Enter') addPlayer(); });
  $('#newTeamNameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') addPlayer(); });
  $('#newTournamentName').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const name = $('#newTournamentName').value.trim(); const tier = $('#newTournamentTier').value; createTournament(name, tier); $('#newTournamentName').value = ''; } });
  $('#poolPlayerName').addEventListener('keydown', (e) => { if (e.key === 'Enter') addPlayerToPoolFromForm(); });
  $('#poolNewTeamName').addEventListener('keydown', (e) => { if (e.key === 'Enter') addPlayerToPoolFromForm(); });
  $('#newTeamName').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTeamFromForm(); });
  window.addEventListener('click', (e) => { if (e.target.classList.contains('modal-overlay')) e.target.classList.add('hidden'); });
}

function init() {
  try {
    if (!currentTournamentId || !getTournament(currentTournamentId)) {
      currentTournament = createDefaultTournament();
      currentTournamentId = currentTournament.id;
    } else {
      currentTournament = getTournament(currentTournamentId);
    }
    loadCurrentTournamentData();
    renderTournamentTabs();
    renderCurrentView();
    bindEvents();
    saveData();
    console.log('系统初始化成功');
  } catch (e) { console.error('初始化失败:', e); }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
